PACKAGE_NAME="snd-soc-tas2783-sdw-px13"
PACKAGE_VERSION="1.1"
BUILT_MODULE_NAME[0]="snd-soc-tas2783-sdw"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make KVER=${kernelver} clean"
AUTOINSTALL="yes"
# The PX13 driver uses the 7.x SDCA API (sdca_regmap_write_init, 2-arg
# sdca_parse_function): it does not build on 6.x, e.g. CachyOS's
# linux-cachyos-lts 6.18. Skip those kernels (dkms exit 77) instead of logging
# a failed build on every LTS update.
BUILD_EXCLUSIVE_KERNEL="^([7-9]|[1-9][0-9])\."

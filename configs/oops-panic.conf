# Turn an unrecoverable kernel oops into a reboot instead of a silent freeze.
#
# 2026-09-05: the post-resume SoundWire recovery raced the ACP teardown and
# oopsed inside release_resource(), which holds the global resource_lock for
# write. The dying task never released it, so every subsequent GPU page fault
# (amdgpu -> ttm -> walk_system_ram_range) spun forever: the desktop froze
# solid with no console, no SysRq path back, and no indication of why. Only a
# power cycle cleared it.
#
# panic_on_oops=1 stops the kernel at the oops rather than letting it limp on
# with a leaked lock; panic=10 then reboots after 10 s (kernel.panic defaults
# to 0, which would just hang at the panic screen and buy nothing).
#
# This does not fix the underlying driver bug - see the comments in
# /usr/local/lib/px13-soundwire-recover.sh. It only makes the failure legible
# and self-clearing.
KERNEL_CMDLINE[default]+=" panic_on_oops=1 panic=10"
